server:
  port: 8080

spring:
  application:
    name: pop-backend
  # 프로필을 따로 안 주면 local(application-local.yml)을 쓴다 → mvn spring-boot:run 만으로 실행
  profiles:
    default: local
  # 실제 접속정보는 application-local.yml(로컬 전용, 공유 금지) 또는 환경변수로 받는다.
  datasource:
    url: ${POP_DB_URL:}
    username: ${POP_DB_USERNAME:}
    password: ${POP_DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

pop:
 
  cors:
    allowed-origins: ${POP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://mokyang-pop.vercel.app}
  login:
    master-user-id: "0000"
    master-password: ${POP_MASTER_PASSWORD:}

logging:
  file:
    name: logs/pop-backend.log
  level:
    # MyBatis SQL과 인자 로그
    com.mokyang.pop: DEBUG
    # 로그인 비밀번호가 로그에 남지 않도록 auth는 INFO 고정
    com.mokyang.pop.auth: INFO
